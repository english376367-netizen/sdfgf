<script>
const EXAMS = [{"name": "Đề số 4", "sections": [{"name": "Language – Pronunciation, Stress & Vocabulary", "type": "mc", "questions": [["1", "Choose the word whose underlined part is pronounced differently.", "streets | phones | books | makes", 1, "The final -s in “phones” is pronounced /z/; the others are pronounced /s/.", "phones /fəʊnz/; streets, books, makes end in /s/.", "Phần đuôi -s của “phones” được phát âm là /z/, còn các từ còn lại là /s/."], ["2", "Choose the word whose underlined part is pronounced differently.", "chorus | scheme | watching | chaos", 2, "The letters “ch” in “watching” are pronounced /tʃ/; in the other words, the sound is /k/.", "watching /ˈwɒtʃɪŋ/; chorus, scheme, chaos have /k/.", "“ch” trong “watching” phát âm /tʃ/; các từ còn lại có âm /k/."], ["3", "Choose the word with a different stress pattern.", "question | believe | concern | request", 0, "“Question” has first-syllable stress; the others have second-syllable stress.", "QUESTION; beLIEVE; conCERN; reQUEST.", "“Question” nhấn âm tiết thứ nhất; các từ còn lại nhấn âm tiết thứ hai."], ["4", "Choose the word with a different stress pattern.", "disaster | avalanche | tsunami | announcement", 1, "“Avalanche” has first-syllable stress; the others have second-syllable stress.", "avaLANCHE? Note: avalanche is stressed on the first syllable; the other words are stressed later.", "“Avalanche” nhấn âm tiết thứ nhất; các từ còn lại nhấn ở âm tiết sau."], ["5", "Be quiet, please! I'm trying to ______ on my homework.", "concentrate | log | advise | bully", 0, "“Concentrate on” means to focus your attention on something.", "I'm trying to concentrate on my homework.", "Làm ơn hãy yên lặng! Tôi đang cố gắng tập trung làm bài tập về nhà."], ["6", "Does your brother dislike ______ his friends? – Yes, he prefers ______ them.", "call / message | calling / messaging | to call / to message | to call / message", 1, "“Dislike” and “prefer” can be followed by V-ing in this sentence.", "Does your brother dislike calling his friends? He prefers messaging them.", "Anh trai bạn không thích gọi điện cho bạn bè phải không? – Đúng vậy, anh ấy thích nhắn tin cho họ hơn."], ["7", "From the hilltop, we can see row after row of orange trees _____ to the horizon.", "running | expanding | enlarging | stretching", 3, "“Stretch to the horizon” means to extend as far as the horizon.", "Rows of orange trees stretch to the horizon.", "Từ trên đỉnh đồi, chúng tôi có thể nhìn thấy những hàng cây cam trải dài đến tận chân trời."], ["8", "The environment won't help us if we ____ it.", "annoy | worry | alarm | disturb", 3, "“Disturb the environment” means to harm or interfere with it.", "The environment won't help us if we disturb it.", "Môi trường sẽ không giúp ích cho chúng ta nếu chúng ta làm xáo trộn/phá hoại nó."], ["9", "A _____ is a violent storm with very strong winds that move in a circle.", "tornado | flood | volcano | landslide", 0, "A tornado is a violent rotating storm with very strong winds.", "A tornado is a violent storm.", "Lốc xoáy là một cơn bão dữ dội với gió rất mạnh chuyển động theo vòng tròn."], ["10", "They spend a lot of time surfing the net; ______, they have little time to read books.", "however | therefore | although | otherwise", 1, "“Therefore” introduces the result of spending a lot of time online.", "They spend a lot of time surfing the net; therefore, they have little time to read books.", "Họ dành nhiều thời gian lướt mạng; vì vậy, họ có ít thời gian đọc sách."], ["11", "I’m free ______ 3 p.m. on Thursday, but I have band practice after that.", "at | until | in | from", 1, "“Until 3 p.m.” means up to 3 p.m.", "I'm free until 3 p.m. on Thursday.", "Tôi rảnh đến 3 giờ chiều thứ Năm, nhưng sau đó tôi có buổi tập ban nhạc."], ["12", "We should walk to school, _______ we shouldn’t throw trash on the ground.", "so | and | but | or", 2, "“But” joins two contrasting ideas.", "We should walk to school, but we shouldn’t throw trash on the ground.", "Chúng ta nên đi bộ đến trường nhưng không nên vứt rác xuống đất."], ["13", "Minh: ______ is the weather girl on VTV3 at 8 o’clock tonight? – Bao: She is Hoai Anh.", "Who | What | When | Why", 0, "“Who” asks about a person.", "Who is the weather girl? She is Hoai Anh.", "Minh: Ai là nữ phát thanh viên thời tiết trên VTV3 lúc 8 giờ tối nay? – Bảo: Cô ấy là Hoài Anh."], ["14", "Gary is very busy with his job. He has ______ time for other things.", "little | a little | few | a few", 0, "“Time” is uncountable. “Little” means not much, with a negative meaning.", "He has little time for other things.", "Gary rất bận rộn với công việc. Anh ấy có rất ít thời gian cho những việc khác."], ["15", "Tom: What an attractive hair style you have got, Mary! – Mary: ______.", "Thank you very much. I am afraid | You are telling a lie | Thank you for your compliment | I don’t like your sayings", 2, "“Thank you for your compliment” is an appropriate response to a compliment.", "Thank you for your compliment.", "Tom: Mary, bạn có kiểu tóc thật đẹp! – Mary: Cảm ơn lời khen của bạn."], ["16", "Jason: Would you like a drink? – Daisy: ______.", "I don’t like coffee | I prefer tea | Coffee, please | I’m very thirsty", 2, "“Coffee, please” is a direct and polite response to an offer.", "Would you like a drink? – Coffee, please.", "Jason: Bạn có muốn uống gì không? – Daisy: Cho tôi cà phê nhé."]]}, {"name": "Word Formation", "type": "text", "questions": [["17", "Finding a balance between what humans and animals need will help prevent habitat ______. (DESTROY)", "destruction", "destruction", "“Prevent” is followed by a noun here: destruction.", "Việc tìm kiếm sự cân bằng giữa nhu cầu của con người và động vật sẽ giúp ngăn chặn sự phá hủy môi trường sống."], ["18", "It is ______ to imagine the changes that robots are bringing to our world. (BELIEVE)", "unbelievable", "unbelievable", "An adjective is needed after “is”: unbelievable.", "Thật khó tin khi tưởng tượng những thay đổi mà rô-bốt đang mang đến cho thế giới chúng ta."], ["19", "My sister is keen on ______. She wants to become a chef in the future. (COOK)", "cooking", "cooking", "“Keen on” is followed by a noun or V-ing.", "Em gái tôi rất thích nấu ăn. Cô ấy muốn trở thành đầu bếp trong tương lai."], ["20", "At harvest time ______ are busy cutting and collecting crops. (FARM)", "farmers", "farmers", "A plural noun is needed as the subject of “are”.", "Vào mùa thu hoạch, những người nông dân bận rộn cắt và thu hoạch mùa màng."]]}, {"name": "Cloze – Family Leisure Activities", "type": "mc", "passage": "Some teenagers enjoy spending free time with their friends. Others prefer doing leisure activities with their family members. I love spending time with my family (1) ______ it’s a great way to connect with them.\\n\\nAt the weekend, we usually go for a bike ride. We (2) ______ to some nearby villages to enjoy the fresh air. We take photos and look at them later. My big brother and I are also (3) ______ cooking. My brother looks for easy recipes. After that, we prepare the ingredients and cook. Sometimes the food is good, but sometimes it isn’t; nevertheless, we love (4) ______ we cook. The leisure activity I like the most is doing DIY projects with my mum. She teaches me (5) ______ my own dresses and doll clothes.\\n\\nOn special occasions, we make special dresses together. Once I won the first prize in a costume contest at my school.", "translation": "Một số thanh thiếu niên thích dành thời gian rảnh với bạn bè. Những người khác thích tham gia các hoạt động giải trí cùng các thành viên trong gia đình. Tôi thích dành thời gian bên gia đình vì đó là cách tuyệt vời để gắn kết với họ.\\n\\nVào cuối tuần, chúng tôi thường đạp xe. Chúng tôi đạp xe đến một vài ngôi làng gần đó để tận hưởng không khí trong lành. Chúng tôi chụp ảnh và xem lại sau. Anh trai tôi và tôi cũng rất thích nấu ăn. Anh tôi tìm những công thức dễ làm. Sau đó, chúng tôi chuẩn bị nguyên liệu và nấu ăn. Đôi khi món ăn ngon, nhưng đôi khi không; dù vậy, chúng tôi yêu thích bất cứ món gì mình nấu. Hoạt động giải trí tôi thích nhất là làm đồ thủ công cùng mẹ. Mẹ dạy tôi tự may váy và quần áo cho búp bê.\\n\\nVào những dịp đặc biệt, chúng tôi cùng nhau may những bộ váy đặc biệt. Có lần tôi đã giành giải nhất trong cuộc thi hóa trang ở trường.", "questions": [["21", "I love spending time with my family (1) ______ it’s a great way to connect with them.", "so | and | because | but", 2, "“Because” gives the reason.", "I love spending time with my family because it’s a great way to connect with them.", "Tôi thích dành thời gian bên gia đình vì đó là cách tuyệt vời để gắn kết với họ."], ["22", "We (2) ______ to some nearby villages to enjoy the fresh air.", "run | walk | drive | cycle", 3, "“Go for a bike ride” is followed by “cycle”.", "We cycle to some nearby villages.", "Chúng tôi đạp xe đến một vài ngôi làng gần đó."], ["23", "My big brother and I are also (3) ______ cooking.", "at | into | on | with", 1, "“Be into something” means to be interested in it.", "My big brother and I are into cooking.", "Anh trai tôi và tôi cũng rất thích nấu ăn."], ["24", "Nevertheless, we love (4) ______ we cook.", "whatever | whenever | wherever | however", 0, "“Whatever” means anything that / no matter what.", "We love whatever we cook.", "Chúng tôi yêu thích bất cứ món gì mình nấu."], ["25", "She teaches me (5) ______ my own dresses and doll clothes.", "make | making | to make | made", 2, "The structure is “teach somebody to do something”.", "She teaches me to make my own dresses and doll clothes.", "Mẹ dạy tôi tự may váy và quần áo cho búp bê."]]}, {"name": "Reading – Life in a Peaceful Village (True / False)", "type": "tf", "passage": "I feel fortunate that I am living in a peaceful village in southern Viet Nam. The scenery here is beautiful and picturesque with vast fields stretching long distances. The houses are surrounded by green trees. There are lakes, ponds, and canals here and there. The air is fresh and cool. Life here seems to move more slowly than in cities. The people work very hard. They grow vegetables, cultivate rice, and raise cattle. At harvest time, they use combine harvesters to harvest their crops.\\n\\nMany families live by growing fruit trees in the orchards. Others live by fishing in lakes, ponds, and canals. Life in the village is very comfortable for children. They play traditional games. Sometimes they help their parents pick fruit and herd cattle.\\n\\nPeople in my village know each other well. They are friendly and hospitable. They often meet each other in the evening, eating fruit, playing chess, singing folk songs, and chatting about everyday activities.", "translation": "Tôi cảm thấy may mắn vì đang sống trong một ngôi làng yên bình ở miền Nam Việt Nam. Phong cảnh nơi đây đẹp như tranh với những cánh đồng rộng lớn trải dài. Những ngôi nhà được bao quanh bởi cây xanh. Đây đó có hồ, ao và kênh rạch. Không khí trong lành và mát mẻ. Cuộc sống ở đây dường như chậm hơn so với thành phố. Người dân làm việc rất chăm chỉ. Họ trồng rau, cấy lúa và chăn nuôi gia súc. Vào mùa thu hoạch, họ dùng máy gặt đập liên hợp để thu hoạch mùa màng.\\n\\nNhiều gia đình sống bằng nghề trồng cây ăn quả trong vườn. Những gia đình khác sống bằng nghề đánh cá ở hồ, ao và kênh rạch. Cuộc sống trong làng rất thoải mái đối với trẻ em. Các em chơi trò chơi dân gian. Đôi khi, các em giúp cha mẹ hái quả và chăn gia súc.\\n\\nMọi người trong làng tôi biết nhau rất rõ. Họ thân thiện và hiếu khách. Họ thường gặp nhau vào buổi tối, ăn trái cây, chơi cờ, hát dân ca và trò chuyện về các hoạt động thường ngày.", "questions": [["26", "Life in the author’s village is very peaceful.", "True | False", 0, "The first sentence says the author lives in a peaceful village.", "I am living in a peaceful village.", "Tác giả nói mình đang sống trong một ngôi làng yên bình."], ["27", "The people in the village work very hard.", "True | False", 0, "The passage states: “The people work very hard.”", "The people work very hard.", "Bài đọc nêu rõ người dân làm việc rất chăm chỉ."], ["28", "Villagers live only by catching fish in lakes, ponds, and canals.", "True | False", 1, "They also grow vegetables, rice, raise cattle and fruit trees.", "They grow vegetables, cultivate rice, raise cattle and grow fruit trees.", "Người dân còn trồng rau, lúa, chăn nuôi gia súc và trồng cây ăn quả."], ["29", "The children are always busy helping their parents.", "True | False", 1, "The passage says they help their parents only sometimes.", "Sometimes they help their parents.", "Các em chỉ đôi khi giúp cha mẹ, không phải lúc nào cũng bận rộn."], ["30", "The villagers get along well.", "True | False", 0, "They know each other well and are friendly and hospitable.", "They are friendly and hospitable.", "Họ biết rõ nhau, thân thiện và hiếu khách."]]}, {"name": "Writing – Sentence Transformation", "type": "text", "questions": [["31", "My sister makes a mess. My mum makes her weed the garden. (Whenever)", "Whenever my sister makes a mess, my mum makes her weed the garden.", "Whenever my sister makes a mess, my mum makes her weed the garden.", "Use “Whenever + present simple” to express a repeated situation.", "Bất cứ khi nào em gái tôi làm bừa bộn, mẹ tôi đều bắt em ấy nhổ cỏ trong vườn."], ["32", "Rita might fail her driving test. But she can take it again. (If)", "If Rita fails her driving test, she can take it again.", "If Rita fails her driving test, she can take it again.", "First conditional: If + present simple, can/will + base verb.", "Nếu Rita trượt bài thi lái xe, cô ấy có thể thi lại."], ["33", "We usually visit museums when we have leisure time. (enjoy)", "We enjoy visiting museums when we have leisure time.", "We enjoy visiting museums when we have leisure time.", "“Enjoy” is followed by V-ing.", "Chúng tôi thích tham quan bảo tàng khi có thời gian rảnh."], ["34", "It was cold. However, Tom still went swimming. (Although)", "Although it was cold, Tom still went swimming.", "Although it was cold, Tom still went swimming.", "“Although” introduces a concessive clause.", "Mặc dù trời lạnh, Tom vẫn đi bơi."], ["35", "My sister walks to school every day. → My sister goes ______.", "to school on foot every day", "to school on foot every day", "“Walk to school” = “go to school on foot”.", "Em gái tôi đi bộ đến trường mỗi ngày."]]}]}, {"name": "Đề số 5", "sections": [{"name": "Language – Pronunciation, Stress & Vocabulary", "type": "mc", "questions": [["1", "Choose the word whose underlined part is pronounced differently.", "neighbors | friends | relatives | photographs", 3, "The ending -s in “photographs” is pronounced /ɪz/ in the source exercise’s marked part; the others are /z/.", "neighbors /z/, friends /z/, relatives /z/, photographs /ɪz/.", "Phần đuôi được gạch chân ở “photographs” có cách phát âm khác các từ còn lại."], ["2", "Choose the word whose underlined part is pronounced differently.", "purchase | machine | champagne | Chicago", 0, "“ch” in “purchase” is /tʃ/; in the other words it is /ʃ/.", "purchase /ˈpɜːtʃəs/; machine, champagne, Chicago begin with /ʃ/.", "“ch” trong “purchase” phát âm /tʃ/, còn các từ còn lại phát âm /ʃ/."], ["3", "Choose the word with a different stress pattern.", "wonder | detest | admire | expect", 0, "“Wonder” has first-syllable stress; the others have second-syllable stress.", "WONder; deTEST; adMIRE; exPECT.", "“Wonder” nhấn âm tiết thứ nhất; các từ còn lại nhấn âm tiết thứ hai."], ["4", "Choose the word with a different stress pattern.", "condition | organize | provider | extremely", 1, "“Organize” has first-syllable stress; the others have second-syllable stress.", "conDItion; ORganize; proVider; exTREMely.", "“Organize” nhấn âm tiết thứ nhất; các từ còn lại nhấn âm tiết thứ hai."], ["5", "How often do you ______ notifications on Facebook? – Once a day.", "upload | browse | connect | check", 3, "We “check notifications” to see new updates.", "How often do you check notifications?", "Bạn thường kiểm tra thông báo trên Facebook bao lâu một lần? – Một lần mỗi ngày."], ["6", "A lot of young families in Viet Nam prefer ______ time doing outdoor activities together.", "spending | spend | spent | to spend", 0, "“Prefer” can be followed by V-ing.", "Families prefer spending time together.", "Nhiều gia đình trẻ ở Việt Nam thích dành thời gian cùng nhau tham gia hoạt động ngoài trời."], ["7", "He often _____ holes in his garden to plant trees.", "ploughs | picks | digs | collects", 2, "The collocation is “dig holes”.", "He often digs holes in his garden.", "Anh ấy thường đào hố trong vườn để trồng cây."], ["8", "Environmental protection refers to activities that ____ or restore the quality of the environment.", "maintain | participate | concentrate | involve", 0, "“Maintain or restore the quality” is the correct collocation.", "Activities maintain or restore environmental quality.", "Bảo vệ môi trường là những hoạt động duy trì hoặc khôi phục chất lượng môi trường."], ["9", "_______ from other states came to Oklahoma to help find the survivors.", "Scientists | Victims | People | Rescue workers", 3, "Rescue workers are the people who search for and help survivors.", "Rescue workers came to help find the survivors.", "Các nhân viên cứu hộ từ những bang khác đã đến Oklahoma để giúp tìm những người sống sót."], ["10", "The farmers will work in the field unless it _____ heavily.", "rains | doesn’t rain | rained | has rained", 0, "After “unless” in a future condition, use the present simple.", "Unless it rains heavily, the farmers will work.", "Nông dân sẽ làm việc ngoài đồng trừ khi trời mưa to."], ["11", "She isn't very popular. She has ______ friends.", "much | many | few | little", 2, "“Friends” is countable plural; “few” means not many.", "She has few friends.", "Cô ấy không nổi tiếng lắm. Cô ấy có ít bạn."], ["12", "I think we should walk to school _______ we can reduce air pollution.", "so that | such that | although | because", 0, "“So that” introduces purpose.", "We should walk to school so that we can reduce air pollution.", "Tôi nghĩ chúng ta nên đi bộ đến trường để có thể giảm ô nhiễm không khí."], ["13", "Andy: ______ is the studio of Vietnam Television? – Bob: In Hanoi.", "When | Where | Why | How", 1, "“Where” asks about a place.", "Where is the studio? – In Hanoi.", "Andy: Đài truyền hình Việt Nam đặt trường quay ở đâu? – Bob: Ở Hà Nội."], ["14", "My first art class ___________ at 9 o’clock tomorrow.", "will star | starts | is starting | has started", 1, "A timetable or fixed schedule uses the present simple.", "My first art class starts at 9 tomorrow.", "Buổi học mỹ thuật đầu tiên của tôi bắt đầu lúc 9 giờ ngày mai."], ["15", "Nam: How well you are playing! – Hoa: ______.", "Say it again. I like to hear your words | I think so. I am proud of myself | Thank you too much | Many thanks. That is a nice compliment", 3, "This is a polite and natural response to a compliment.", "Many thanks. That is a nice compliment.", "Nam: Bạn chơi giỏi quá! – Hoa: Cảm ơn nhiều. Đó là một lời khen thật dễ thương."], ["16", "Minh: I’m very sorry. – Nhi: ______.", "I’m afraid so | I think so | That’s all right | I don’t want", 2, "“That’s all right” is a suitable response to an apology.", "I'm very sorry. – That's all right.", "Minh: Mình rất xin lỗi. – Nhi: Không sao đâu."]]}, {"name": "Word Formation", "type": "text", "questions": [["17", "Building a new factory in the city would be ______ disastrous. (ENVIRONMENT)", "environmentally", "environmentally", "An adverb modifies the adjective “disastrous”.", "Việc xây dựng một nhà máy mới trong thành phố sẽ gây tai hại về mặt môi trường."], ["18", "Earth Day is an event to raise ______ about environmental issues. (AWARE)", "awareness", "awareness", "The phrase is “raise awareness”.", "Ngày Trái Đất là sự kiện nhằm nâng cao nhận thức về các vấn đề môi trường."], ["19", "The local people are kind and hospitable to ______. (VISIT)", "visitors", "visitors", "A plural noun is needed after “to”.", "Người dân địa phương tử tế và hiếu khách với du khách."], ["20", "In my leisure time, I love knitting, building dollhouses, and ______ paper flowers. (MAKE)", "making", "making", "Keep the parallel V-ing form in the list.", "Trong thời gian rảnh, tôi thích đan len, làm nhà búp bê và làm hoa giấy."]]}, {"name": "Cloze – Mountain Climbing", "type": "mc", "passage": "There are a lot of pastimes that young people like, and one of (21) ________ is mountain climbing. It is an active leisure activity that people can do either indoors or outdoors. If you go climbing outdoors, it is a great way to (22) ________ your strength and enjoy the nature at the same time. You can even set up your own climbing wall in your backyard or (23) ________ your home. This way you don't have to go out and still can keep fit and enjoy the activity.\\n\\nSo how can you start mountain climbing? Many people take a class to learn how to climb and use their equipment (24) ________. Others join climbing clubs to make new friends with the same interest and go climbing together. If you are an active person and like outdoor activities, (25) ________ don't you try this activity?", "translation": "Có rất nhiều hoạt động giải trí mà người trẻ yêu thích, và một trong số đó là leo núi. Đây là hoạt động giải trí năng động mà mọi người có thể thực hiện trong nhà hoặc ngoài trời. Nếu leo núi ngoài trời, đó là cách tuyệt vời để tăng cường sức mạnh và đồng thời tận hưởng thiên nhiên. Bạn thậm chí có thể dựng một bức tường leo núi của riêng mình ở sân sau hoặc bên trong nhà. Nhờ vậy, bạn không cần ra ngoài mà vẫn có thể giữ dáng và tận hưởng hoạt động này.\\n\\nVậy bạn có thể bắt đầu leo núi như thế nào? Nhiều người tham gia một lớp học để học cách leo núi và sử dụng thiết bị hiệu quả. Những người khác tham gia các câu lạc bộ leo núi để kết bạn với những người có cùng sở thích và cùng nhau đi leo núi. Nếu bạn năng động và thích các hoạt động ngoài trời, tại sao bạn không thử hoạt động này?", "questions": [["21", "One of (21) ________ is mountain climbing.", "them | they | theirs | their", 0, "“One of them” means one activity from the group.", "One of them is mountain climbing.", "Một trong số đó là hoạt động leo núi."], ["22", "It is a great way to (22) ________ your strength.", "decrease | reduce | increase | raise", 2, "“Increase your strength” is the natural collocation.", "Increase your strength.", "Tăng cường sức mạnh của bạn."], ["23", "Set up your own climbing wall in your backyard or (23) ________ your home.", "indoor | inside | within | among", 1, "“Inside your home” means within the house.", "Inside your home.", "Bên trong ngôi nhà của bạn."], ["24", "Learn how to climb and use their equipment (24) ________.", "effective | effect | effectively | effectiveness", 2, "An adverb modifies the verb “use”.", "Use their equipment effectively.", "Sử dụng thiết bị của họ một cách hiệu quả."], ["25", "If you are an active person, (25) ________ don't you try this activity?", "what | why | how | when", 1, "The suggestion structure is “Why don't you + V...?”", "Why don't you try this activity?", "Nếu bạn là người năng động, tại sao bạn không thử hoạt động này?"]]}, {"name": "Reading – The Countryside in Britain", "type": "mc", "passage": "Besides its beauty, the countryside of Britain is well known for many contrasts: its bare mountains and moorland, its lakes, rivers and woods, and its long, often wild coastline. National parks which are protected from development by the government have the most beautiful and picturesque scenery. British people often associate the countryside with farmland, open spaces like fields of wheat and barley, green fields enclosed by hedges or stone walls in which cows or sheep are raised.\\n\\nMost farmland is now owned by individual people or independent companies. However, the government has built a network of public footpaths across the farmland.\\n\\nMany British people enjoy the peace and relaxation of life in the countryside where they can spend their free time walking, cycling, or going for a picnic or a pub lunch. In summer they can pick strawberries and other fruit in fruit farms. Nowadays, few rural people work on farms. Many of them commute to work in towns. Many others wish to live in the countryside so that they would have a better and healthier lifestyle.", "translation": "Bên cạnh vẻ đẹp, vùng nông thôn nước Anh nổi tiếng với nhiều cảnh quan tương phản: những ngọn núi trơ trụi và vùng đất hoang, hồ, sông, rừng và đường bờ biển dài, thường hoang sơ. Các công viên quốc gia được chính phủ bảo vệ khỏi sự phát triển xây dựng có phong cảnh đẹp như tranh. Người Anh thường liên hệ vùng nông thôn với đất nông nghiệp, những không gian mở như cánh đồng lúa mì và lúa mạch, những cánh đồng xanh được bao quanh bởi hàng rào hoặc tường đá, nơi bò và cừu được nuôi.\\n\\nHiện nay, phần lớn đất nông nghiệp thuộc sở hữu của cá nhân hoặc các công ty độc lập. Tuy nhiên, chính phủ đã xây dựng một mạng lưới đường đi bộ công cộng xuyên qua các khu đất nông nghiệp.\\n\\nNhiều người Anh thích sự yên bình và thư thái của cuộc sống ở nông thôn, nơi họ có thể dành thời gian rảnh để đi bộ, đạp xe, đi dã ngoại hoặc ăn trưa tại quán rượu. Vào mùa hè, họ có thể hái dâu tây và các loại trái cây khác ở trang trại trái cây. Ngày nay, ít người dân nông thôn làm việc trong các trang trại. Nhiều người trong số họ đi làm ở các thị trấn. Nhiều người khác muốn sống ở nông thôn để có lối sống tốt hơn và lành mạnh hơn.", "questions": [["26", "The countryside of Britain is NOT famous for its ______.", "farmland | moorland | bare mountains | lakes, rivers, and woods", 0, "The passage lists moorland, bare mountains, lakes, rivers and woods as features; farmland is associated with the countryside, but question answer key on source is farmland.", "The countryside is famous for mountains, moorland, lakes, rivers and woods.", "Bài đọc liệt kê núi, vùng đất hoang, hồ, sông và rừng là các cảnh quan nổi bật."], ["27", "Individual people or independent companies own ______.", "some of the farmland in Britain | most farmland in Britain | footpaths across the farmland | a network of public footpaths", 1, "The passage says most farmland is owned by individuals or independent companies.", "Most farmland is now owned by individual people or independent companies.", "Phần lớn đất nông nghiệp hiện thuộc sở hữu của cá nhân hoặc công ty độc lập."], ["28", "Many British people think the countryside goes with ______.", "work in towns | work on farms | peace and relaxation | public farmland", 2, "The passage explicitly mentions peace and relaxation.", "Many British people enjoy the peace and relaxation of life in the countryside.", "Nhiều người Anh thích sự yên bình và thư thái của cuộc sống ở nông thôn."], ["29", "The word “commute” in the passage is closest in meaning to ______.", "go on foot | go by public transport | go by bicycle | go by car", 1, "“Commute” means travel regularly between home and work; this option is the closest among those given.", "Many rural people commute to work in towns.", "Nhiều người dân nông thôn đi lại đến các thị trấn để làm việc."], ["30", "What does the word “they” in the passage refer to?", "Those who commute to work in towns | Those who go to the country for a picnic | Those who go to fruit farms in summer | Those who dream of living in the country", 0, "“Many of them” refers to rural people in the previous sentence.", "Nowadays, few rural people work on farms. Many of them commute to work in towns.", "Ngày nay, ít người dân nông thôn làm việc trong trang trại. Nhiều người trong số họ đi làm ở các thị trấn."]]}, {"name": "Writing – Sentence Transformation", "type": "text", "questions": [["31", "I read my favourite book. Then I went to bed. (After)", "After I had read my favourite book, I went to bed.", "After I had read my favourite book, I went to bed.", "Use “After + past perfect” for the earlier action.", "Sau khi đọc cuốn sách yêu thích, tôi đi ngủ."], ["32", "Alice may miss the train. But she can get the next one. (If)", "If Alice misses the train, she can get the next one.", "If Alice misses the train, she can get the next one.", "First conditional: If + present simple, can + base verb.", "Nếu Alice lỡ chuyến tàu, cô ấy có thể đi chuyến tiếp theo."], ["33", "Jenny finds reading poetry boring. (dislike)", "Jenny dislikes reading poetry.", "Jenny dislikes reading poetry.", "“Dislike” is followed by V-ing.", "Jenny không thích đọc thơ."], ["34", "I last wrote to my pen-pal two months ago. → I haven’t ______.", "written to my pen-pal for two months", "written to my pen-pal for two months", "Use present perfect with “for” to describe a period continuing to now.", "Tôi đã không viết thư cho bạn qua thư trong hai tháng."], ["35", "Although he is strong, he can’t move that stone. → In spite ______.", "of being strong, he can't move that stone", "of being strong, he can't move that stone", "“Although + clause” can be changed to “In spite of + noun/V-ing”.", "Mặc dù khỏe, anh ấy không thể di chuyển hòn đá đó."]]}]}, {"name": "Đề số 6", "sections": [{"name": "Language – Pronunciation, Stress & Vocabulary", "type": "mc", "questions": [["1", "Choose the word whose underlined part is pronounced differently.", "helps | laughs | cooks | finds", 3, "The final -s in “finds” is pronounced /z/; the others are pronounced /s/.", "helps /s/, laughs /s/, cooks /s/, finds /z/.", "Đuôi -s trong “finds” phát âm /z/, các từ còn lại phát âm /s/."], ["2", "Choose the word whose underlined part is pronounced differently.", "chemistry | scholarship | chocolate | architect", 2, "“ch” in “chocolate” is /tʃ/; the others are /k/.", "chocolate /ˈtʃɒklət/; chemistry, scholarship, architect have /k/.", "“ch” trong “chocolate” phát âm /tʃ/, các từ còn lại phát âm /k/."], ["3", "Choose the word with a different stress pattern.", "response | dislike | damage | explore", 2, "“Damage” has first-syllable stress; the others have second-syllable stress.", "DAMage; reSPONSE; disLIKE; exPLORE.", "“Damage” nhấn âm tiết thứ nhất; các từ còn lại nhấn âm tiết thứ hai."], ["4", "Choose the word with a different stress pattern.", "martial | survival | hospital | natural", 1, "“Survival” has second-syllable stress; the others have first-syllable stress.", "MARtial; surVIVal; HOSpital; NATural.", "“Survival” nhấn âm tiết thứ hai; các từ còn lại nhấn âm tiết thứ nhất."], ["5", "What are you interested ______ doing at weekends?", "into | on | about | in", 3, "The fixed structure is “be interested in + V-ing”.", "What are you interested in doing?", "Bạn thích làm gì vào cuối tuần?"], ["6", "About 16% of them love ________ swimming.", "to go | go | going | went", 2, "“Love” can be followed by V-ing.", "They love going swimming.", "Khoảng 16% trong số họ thích đi bơi."], ["7", "The workers are _____ a truck with timber.", "unloading | loading | taking | filling", 1, "“Load a truck with timber” means put timber onto a truck.", "The workers are loading a truck with timber.", "Các công nhân đang chất gỗ lên xe tải."], ["8", "Students should learn some practical ways that help to ____ pollution.", "save | cure | reduce | shorten", 2, "The natural collocation is “reduce pollution”.", "Ways that help to reduce pollution.", "Những cách thiết thực giúp giảm ô nhiễm."], ["9", "____ she left the party, Jenny said goodbye to the host.", "Before | After | As soon as | Until", 0, "The intended sequence is that Jenny said goodbye before leaving.", "Before she left the party, Jenny said goodbye to the host.", "Trước khi rời bữa tiệc, Jenny chào tạm biệt chủ nhà."], ["10", "The earthquake caused a lot of _____ to the infrastructure of this area.", "disaster | loss | damage | property", 2, "The collocation is “cause damage to”.", "The earthquake caused a lot of damage.", "Trận động đất đã gây ra nhiều thiệt hại cho cơ sở hạ tầng khu vực này."], ["11", "It is ______ easier to prevent harm to the environment than to repair it.", "always | never | sometimes | rarely", 0, "“Always easier” expresses a general truth.", "It is always easier to prevent harm than to repair it.", "Ngăn ngừa tác hại đối với môi trường luôn dễ hơn khắc phục nó."], ["12", "If the bridge ______ we won't be able to cross the river.", "collapses | is collapsing | collapsed | collapsed", 0, "First conditional uses present simple in the if-clause.", "If the bridge collapses, we won't be able to cross the river.", "Nếu cây cầu sập, chúng ta sẽ không thể băng qua sông."], ["13", "Andy: ______ do people like watching game shows? – Bob: Because they are educational and entertaining.", "When | Where | Why | How", 2, "“Because” answers a “Why” question.", "Why do people like watching game shows?", "Andy: Tại sao mọi người thích xem chương trình trò chơi? – Bob: Vì chúng mang tính giáo dục và giải trí."], ["14", "We need to take care of the oceans, _______ we need to protect forests.", "but | and | or | so", 1, "“And” joins two ideas that should both be done.", "We need to take care of the oceans, and we need to protect forests.", "Chúng ta cần chăm sóc đại dương và bảo vệ rừng."], ["15", "Nhi: Thanks for the nice gift you brought to us! – Vy: ______.", "Actually speaking, I myself don’t like it. | Welcome! It’s very nice of you. | All right. Do you know how much it cost? | Not at all. Don’t mention it.", 3, "“Not at all. Don’t mention it” is a polite response to thanks.", "Thanks for the nice gift! – Not at all. Don’t mention it.", "Nhi: Cảm ơn món quà đẹp bạn mang đến cho chúng tôi! – Vy: Không có gì. Đừng bận tâm."], ["16", "Mary: Can you speak English? – Mi: ______.", "No, I’m not | A little | Yes, too much | What a pity!", 1, "“A little” is a natural answer about language ability.", "Can you speak English? – A little.", "Mary: Bạn có thể nói tiếng Anh không? – Mi: Một chút."]]}, {"name": "Word Formation", "type": "text", "questions": [["17", "My brother is working as a volunteer for animal protection ______. (ORGANISE)", "organisation", "organisation", "A noun is needed after “animal protection”.", "Anh trai tôi đang làm tình nguyện viên cho tổ chức bảo vệ động vật."], ["18", "Today, scientists are able to predict most natural ______. (DISASTROUS)", "disasters", "disasters", "A plural noun is needed after “most natural”.", "Ngày nay, các nhà khoa học có thể dự đoán hầu hết các thảm họa thiên nhiên."], ["19", "The Internet ______ at our home is not strong, so I can't study. (CONNECT)", "connection", "connection", "The noun “connection” is needed as the subject.", "Kết nối Internet ở nhà chúng tôi không mạnh, vì vậy tôi không thể học."], ["20", "Our factory needs a lot of ______ workers. (TRAIN)", "trained", "trained", "A past participle adjective describes the workers.", "Nhà máy của chúng tôi cần nhiều công nhân đã qua đào tạo."]]}, {"name": "Cloze – Village Life", "type": "mc", "passage": "I live in a small village in Ninh Binh. I love the (21) _________ peace and quiet of my village. The air is unpolluted, and the (22) _________ of life is slow. The people in my village are friendly and hospitable. They are always willing (23) _________ each other. We cultivate mainly rice and beans. We raise cows and buffaloes too. We can also enjoy (24) _________ in the nearby area. It is actually a national park, so the wildlife there can live and move (25) _________.\\n\\nAll these things make me love my village more and intend to live here my whole life.", "translation": "Tôi sống trong một ngôi làng nhỏ ở Ninh Bình. Tôi yêu sự yên bình và tĩnh lặng mang nét thôn quê của ngôi làng mình. Không khí không bị ô nhiễm và nhịp sống chậm rãi. Người dân trong làng thân thiện và hiếu khách. Họ luôn sẵn lòng giúp đỡ lẫn nhau. Chúng tôi chủ yếu trồng lúa và đậu. Chúng tôi cũng nuôi bò và trâu. Chúng tôi còn có thể tận hưởng thiên nhiên ở khu vực gần đó. Đó thực ra là một công viên quốc gia, vì vậy động vật hoang dã ở đó có thể sống và di chuyển an toàn.\\n\\nTất cả những điều này khiến tôi yêu ngôi làng hơn và dự định sống ở đây cả đời.", "questions": [["21", "I love the (21) _________ peace and quiet of my village.", "urban | rural | suburban", 1, "“Rural” means related to the countryside.", "I love the rural peace and quiet of my village.", "Tôi yêu sự yên bình và tĩnh lặng của vùng quê nơi mình sống."], ["22", "The air is unpolluted, and the (22) _________ of life is slow.", "speed | step | pace", 2, "“Pace of life” is the fixed phrase meaning the speed of everyday life.", "The pace of life is slow.", "Nhịp sống chậm rãi."], ["23", "They are always willing (23) _________ each other.", "to help | helping | help", 0, "“Be willing to do something” is the correct structure.", "They are always willing to help each other.", "Họ luôn sẵn lòng giúp đỡ lẫn nhau."], ["24", "We can also enjoy (24) _________ in the nearby area.", "nature | environment | countryside", 0, "“Enjoy nature” is the natural collocation.", "We can enjoy nature in the nearby area.", "Chúng tôi có thể tận hưởng thiên nhiên ở khu vực gần đó."], ["25", "The wildlife there can live and move (25) _________.", "safe | safety | safely", 2, "An adverb is needed to modify “live and move”.", "The wildlife can live and move safely.", "Động vật hoang dã có thể sống và di chuyển an toàn."]]}, {"name": "Reading – Knitting as a Pastime (True / False)", "type": "tf", "passage": "My grandma and I share a pastime: knitting. She taught me how to knit when I was ten years old. In the evening, we both sit in front of the TV and knit. Now I can knit scarves, hats, and even sweaters. I remember last year I had to find a birthday present for my dad. Then I thought of knitting a sweater for him. I searched the Internet for a day, and finally I found the pattern that came with a YouTube video showing me how to make a sweater. It took me a week to finish it.\\n\\nDad was so happy with the present and said it was his favourite sweater. The best thing about knitting is that it makes you be more careful and patient. Sometimes you drop stitches or hold the wool too tight, so you need to continually practise. My grandma says knitting is magical because you can create anything you want with just wool and a pair of needles. I love knitting!", "translation": "Bà tôi và tôi có chung một sở thích: đan len. Bà dạy tôi đan len khi tôi mười tuổi. Vào buổi tối, cả hai bà cháu ngồi trước TV và đan len. Bây giờ tôi có thể đan khăn quàng, mũ và thậm chí cả áo len. Tôi nhớ năm ngoái mình cần tìm một món quà sinh nhật cho bố. Sau đó tôi nghĩ đến việc đan một chiếc áo len cho bố. Tôi tìm kiếm trên Internet trong một ngày và cuối cùng tìm được mẫu đan kèm video YouTube hướng dẫn cách làm áo. Tôi mất một tuần để hoàn thành nó.\\n\\nBố rất vui với món quà và nói đó là chiếc áo len yêu thích của bố. Điều tuyệt vời nhất về việc đan len là nó giúp bạn trở nên cẩn thận và kiên nhẫn hơn. Đôi khi bạn làm tuột mũi đan hoặc kéo len quá chặt, vì vậy bạn cần luyện tập liên tục. Bà tôi nói đan len thật kỳ diệu vì bạn có thể tạo ra bất cứ thứ gì mình muốn chỉ với len và một đôi kim đan. Tôi yêu thích đan len!", "questions": [["26", "The girl started knitting when she was in grade 10.", "True | False", 1, "She began when she was ten years old, not in grade 10.", "She was ten years old.", "Cô bé bắt đầu đan len khi mới mười tuổi, không phải học lớp 10."], ["27", "She found the pattern for her dad’s sweater online.", "True | False", 0, "She searched the Internet and found the pattern.", "She searched the Internet and found the pattern.", "Cô bé tìm mẫu đan áo len cho bố trên Internet."], ["28", "She spent more than a week knitting the sweater.", "True | False", 1, "The passage says it took her a week.", "It took me a week to finish it.", "Cô bé mất một tuần để hoàn thành chiếc áo, không phải hơn một tuần."], ["29", "Knitting makes people feel more careful and patient.", "True | False", 0, "The passage directly says knitting makes you more careful and patient.", "It makes you be more careful and patient.", "Đan len giúp con người cẩn thận và kiên nhẫn hơn."], ["30", "The girl’s dad says knitting is magical.", "True | False", 1, "It is the grandmother who says knitting is magical.", "My grandma says knitting is magical.", "Người nói đan len thật kỳ diệu là bà, không phải bố."]]}, {"name": "Writing – Sentence Transformation", "type": "text", "questions": [["31", "The choir practised for half an hour. After that, they went on stage. (Before)", "Before they went on stage, the choir had practised for half an hour.", "Before they went on stage, the choir had practised for half an hour.", "Use past perfect for the action that happened first.", "Trước khi lên sân khấu, dàn hợp xướng đã luyện tập nửa tiếng."], ["32", "Stop talking or you won’t understand the lesson. (Unless)", "Unless you stop talking, you won't understand the lesson.", "Unless you stop talking, you won't understand the lesson.", "“Unless” means “if ... not”.", "Nếu bạn không ngừng nói chuyện, bạn sẽ không hiểu bài."], ["33", "John is very sad. He fails the final exam. (because)", "John is very sad because he fails the final exam.", "John is very sad because he fails the final exam.", "Use “because” to give the reason.", "John rất buồn vì cậu ấy trượt kỳ thi cuối kỳ."], ["34", "There are many plants in our garden. → Our garden ______.", "has many plants", "has many plants", "Change “There are...” to “have/has”.", "Vườn nhà chúng tôi có nhiều cây."], ["35", "The garden is in front of Nam’s classroom. → Nam’s classroom ______.", "is behind the garden", "is behind the garden", "“In front of” and “behind” express opposite positions.", "Lớp học của Nam ở phía sau khu vườn."]]}]}];
let examIndex=0, sectionIndex=0, qIndex=0, state={};
function enter(){if(document.getElementById('pw').value==='367'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}else document.getElementById('err').textContent='Mật khẩu không đúng. Vui lòng thử lại.'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function key(e,s,q){return e+'_'+s+'_'+q}
function splitOptions(str){return str.split(' | ')}
function markedWord(word,num,section){let safe=esc(word);if(section.startsWith('Language')&&num==='1')return safe.replace(/s$/,'<span class=\"underline\">s</span>');if(section.startsWith('Language')&&num==='2')return safe.replace(/ch/i,m=>'<span class=\"underline\">'+m+'</span>');return safe;}
function render(){let ex=EXAMS[examIndex];document.getElementById('examTabs').innerHTML=EXAMS.map((e,i)=>`<button class="tab ${i===examIndex?'active':''}" onclick="switchExam(${i})">${e.name}</button>`).join('');
document.getElementById('sectionTabs').innerHTML=ex.sections.map((s,i)=>`<button class="tab ${i===sectionIndex?'active':''}" onclick="switchSection(${i})">${s.name}</button>`).join('');
let sec=ex.sections[sectionIndex], qs=sec.questions, k=key(examIndex,sectionIndex,qIndex), saved=state[k], q=qs[qIndex];
let passage=sec.passage?`<div class="reading"><div class="passage"><h3>Reading passage – English</h3>${esc(sec.passage)}</div><div class="passage"><h3>Bản dịch tiếng Việt</h3>${esc(sec.translation||'')}</div></div>`:'';
let prompt=q[1], opts='';
if(sec.type==='mc'||sec.type==='tf'){let choices=splitOptions(q[2]);opts='<div class="options">'+choices.map((o,i)=>`<button class="opt ${saved?(i===q[3]?'correct':(i===saved.choice?'wrong':'')):''}" ${saved?'disabled':''} onclick="answer(${qIndex},${i})"><b>${String.fromCharCode(65+i)}.</b> ${markedWord(o,q[0],sec.name)}</button>`).join('')+'</div>'}
else{opts=`<input class="answer" id="typed" ${saved?'disabled':''} placeholder="Type your answer here..." value="${saved?esc(saved.value):''}"><button ${saved?'disabled':''} onclick="submitText()">Submit answer</button>`}
let fb=saved?`<div class="feedback ${saved.correct?'good':'bad'}"><b>${saved.correct?'✓ Correct!':'✗ Not quite.'}</b><br><b>Correct answer:</b> ${esc(q[3])}<br><b>Explanation:</b> ${esc(q[4])}<br><b>Full-sentence meaning:</b> ${esc(q[5])}</div>`:'';
document.getElementById('sections').innerHTML=`<div class="panel section active"><h2>${esc(sec.name)}</h2>${passage}<div class="progress"><span style="width:${((qIndex+1)/qs.length)*100}%"></span></div><div class="qbox"><div class="qmeta">QUESTION ${qIndex+1} / ${qs.length} · ${esc(q[0])}</div><div class="prompt">${esc(prompt)}</div>${opts}${fb}<div class="controls"><button class="secondary" onclick="move(-1)" ${qIndex===0?'disabled':''}>← Previous</button><span class="muted">Question ${qIndex+1} of ${qs.length}</span><button onclick="move(1)" ${qIndex===qs.length-1?'disabled':''}>Next →</button></div></div><div class="controls"><span class="score">Section score: ${sectionScore(examIndex,sectionIndex)} / ${qs.length}</span><button class="reset" onclick="resetSection()">↻ Reset this section</button></div></div>`;
document.getElementById('totalScore').textContent='Total answered score: '+totalScore()+' points';}
function answer(i,choice){let sec=EXAMS[examIndex].sections[sectionIndex],q=sec.questions[i],correct=choice===q[3];state[key(examIndex,sectionIndex,i)]={choice,correct};render()}
function submitText(){let sec=EXAMS[examIndex].sections[sectionIndex],q=sec.questions[qIndex],v=document.getElementById('typed').value.trim();if(!v)return;let expected=String(q[3]).toLowerCase(), got=v.toLowerCase().replace(/[.!?]/g,'').replace(/\s+/g,' ').trim();let correct=got===expected||expected.split(' / ').some(x=>got===x.toLowerCase());state[key(examIndex,sectionIndex,qIndex)]={value:v,correct};render()}
function move(d){let max=EXAMS[examIndex].sections[sectionIndex].questions.length-1;qIndex=Math.max(0,Math.min(max,qIndex+d));render()}
function switchExam(i){examIndex=i;sectionIndex=0;qIndex=0;render()}
function switchSection(i){sectionIndex=i;qIndex=0;render()}
function resetSection(){if(!confirm('Reset toàn bộ câu trả lời của phần này?'))return;let sec=EXAMS[examIndex].sections[sectionIndex];sec.questions.forEach((q,i)=>delete state[key(examIndex,sectionIndex,i)]);qIndex=0;render()}
function sectionScore(e,s){let sec=EXAMS[e].sections[s];return sec.questions.filter((q,i)=>state[key(e,s,i)]?.correct).length}
function totalScore(){return EXAMS.reduce((sum,e,ei)=>sum+e.sections.reduce((n,s,si)=>n+sectionScore(ei,si),0),0)}
</script></body></html>
